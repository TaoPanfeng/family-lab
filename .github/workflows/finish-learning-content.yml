name: Finish reviewed lesson formula alignment
on:
  push:
    branches: ['work/learning-clarity']
    paths: ['.github/workflows/finish-learning-content.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Align substitution example and add a semantic regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('projects/math/teaching-data.js');raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='582440f3775b78af0c5783fa0feaf91db3f95abeaf09d28aa7a3864b46d21fd6'
          text=raw.decode()
          old='"formula": '+json.dumps(r'\int u\,dv=uv-\int v\,du')
          new='"formula": '+json.dumps(r'\int_0^1 2x\cos(x^2)\,dx=\int_0^1\cos u\,du=\sin1')
          assert text.count(old)==1
          p.write_text(text.replace(old,new))
          p=Path('tests/learning-models.test.cjs')
          regression=r'''
          test('integration examples distinguish substitution from integration by parts',()=>{
            assert(T['integration-methods'].formula.includes(String.raw`\cos(x^2)`));
            assert(T['integration-methods'].formula.includes(String.raw`\int_0^1\cos u`));
            assert(T['integration-methods'].alternate.steps[1].includes(String.raw`xe^x`));
          });
          '''
          text=p.read_text();assert 'integration examples distinguish substitution' not in text
          p.write_text(text+regression)
          PY
          node --test tests/learning-models.test.cjs
      - name: Commit without overwriting newer work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          branch='work/learning-clarity'
          git fetch origin "$branch"
          test "$(git rev-parse "origin/$branch")" = "$GITHUB_SHA"
          git add -- projects/math/teaching-data.js tests/learning-models.test.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(math): 区分换元与分部积分两个例子，公式与当前步骤同步'
          git push origin "HEAD:refs/heads/$branch"
