name: Import Family Lab

on:
  push:
    branches: [main]
    paths:
      - 'family-lab.zip'
      - '.github/workflows/import-family-lab.yml'
      - '.github/scripts/import_archive.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-lab-initial-import
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      pending: ${{ steps.archive.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: archive
        run: |
          if test -f family-lab.zip && ! test -f catalog.json; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pending=false' >> "$GITHUB_OUTPUT"
            echo 'Initial import is not needed; existing projects will not be overwritten.' >> "$GITHUB_STEP_SUMMARY"
          fi

  import:
    needs: inspect
    if: github.ref == 'refs/heads/main' && needs.inspect.outputs.pending == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and unpack the original delivery
        run: python .github/scripts/import_archive.py extract
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build all five offline projects and the homepage
        run: npm run build
      - name: Require the rebuilt files to match the delivery
        run: python .github/scripts/import_archive.py verify
      - name: Install locked test-only dependencies
        run: npm --prefix projects/history ci --ignore-scripts --no-audit --no-fund
      - name: Run model, data and DOM tests
        run: npm test
      - name: Install test driver and verify preinstalled Chrome
        timeout-minutes: 3
        run: |
          python -m pip install playwright==1.57.0
          google-chrome --version
      - name: Test actual local-file navigation and interactions
        run: python tests/browser-smoke.py --browser "$(command -v google-chrome)" --out .qa/import-browser
      - name: Stage only verified project files
        run: python .github/scripts/import_archive.py finalize
      - name: Commit and push the complete project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: 解压导入日月地、物理、化学、历史、坐卧及公共首页，仅保留最新版'
          gh auth setup-git
          git push origin HEAD:main
          echo '### Complete project committed' >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          echo 'The import ZIP was removed from the current tree; it remains in Git history.' >> "$GITHUB_STEP_SUMMARY"
      - name: Start verification and optional Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Preserve browser-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-browser-results
          path: .qa/import-browser
          if-no-files-found: ignore
          retention-days: 7
