name: Restore reviewed quality refactor
on:
  push:
    branches: ['feature/four-museums-20261023']
    paths: ['.maintenance/quality/ready.json']
permissions:
  contents: read
concurrency:
  group: restore-reviewed-quality
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore exact reviewed source with checksums
        run: |
          python -m pip install pyshp==2.3.1
          python .github/scripts/restore-quality.py restore
      - name: Build and check the recovered applications
        run: |
          npm run build
          node tools/test.cjs --offline
      - name: Stage verified source without generated test reports
        run: python .github/scripts/restore-quality.py stage
      - name: Commit source to the existing work branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch origin feature/four-museums-20261023
          test "$(git rev-parse origin/feature/four-museums-20261023)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: 重构连续动画、人体手型、地图与宇宙视图，新增双缝和菲索光学实验' -m '恢复逐文件SHA256核验的整改成果；旧实验保留。此提交仍需完整云端浏览器验收后合并发布。'
          git push origin HEAD:feature/four-museums-20261023
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
