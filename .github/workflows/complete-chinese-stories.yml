name: Verify complete Chinese stories and mobile entry
on:
  push:
    branches: ['work/chinese-phrases']
    paths: ['.delivery/complete-stories/manifest.json']
permissions:
  contents: write
concurrency:
  group: complete-chinese-stories-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore checksummed reviewed stories and source
        run: |
          python - <<'PY'
          import hashlib,json,lzma,pathlib
          root=pathlib.Path.cwd()
          folder=root/'.delivery/complete-stories'
          manifest=json.loads((folder/'manifest.json').read_text())
          allowed={'projects/chinese/stories-data.js','projects/chinese/phrases.js','projects/chinese/phrases.html','projects/chinese/phrases.css','projects/chinese/index.html','projects/chinese/README.md','tests/phrases.test.cjs','tests/phrases-browser.py'}
          parts=[]
          for item in manifest['parts']:
              p=folder/item['name']
              if p.resolve().parent!=folder.resolve() or p.is_symlink():
                  raise RuntimeError('Unsafe transfer path')
              raw=p.read_bytes()
              if len(raw)!=item['bytes'] or hashlib.sha256(raw).hexdigest()!=item['sha256']:
                  raise RuntimeError('Chunk integrity error: '+item['name'])
              parts.append(raw)
          archive=b''.join(parts)
          if hashlib.sha256(archive).hexdigest()!=manifest['sha256']:
              raise RuntimeError('Archive integrity error')
          files=json.loads(lzma.decompress(archive))
          if len(files)!=manifest['files'] or set(files)!=allowed:
              raise RuntimeError('Unexpected source paths')
          checked=[]
          for name,item in files.items():
              p=root/name
              if p.is_symlink() or not p.resolve().is_relative_to(root):
                  raise RuntimeError('Unsafe source destination')
              expected=item['base_sha256']
              if expected is None:
                  if p.exists():raise RuntimeError('New source already exists: '+name)
              elif not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest()!=expected:
                  raise RuntimeError('Source changed; review before writing: '+name)
              new=item['content'].encode('utf-8')
              if hashlib.sha256(new).hexdigest()!=item['sha256']:
                  raise RuntimeError('Source checksum mismatch: '+name)
              checked.append((p,new))
          for p,new in checked:p.write_bytes(new)
          print('Verified and restored',len(checked),'source files; no unrelated paths changed.')
          PY
      - name: Build and run original offline model tests plus complete story semantics
        run: |
          node --check projects/chinese/stories-data.js
          node --check projects/chinese/phrases.js
          python -m py_compile tests/phrases-browser.py
          npm run build
          node tools/test.cjs --offline
      - name: Install real browser driver and Chinese screenshot fonts
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          google-chrome --version
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y --no-install-recommends fonts-wqy-zenhei
          test -n "$(fc-list :lang=zh file | head -n 1)"
      - name: Real offline complete stories, phone entry, trusted touch and saved drafts
        run: |
          python tests/phrases-browser.py --file --browser /usr/bin/google-chrome --out .qa/full-stories-file
          python tests/chinese-browser.py --file --browser /usr/bin/google-chrome --out .qa/characters-file
      - name: Real HTTP complete stories and original character lessons
        run: |
          python tools/prepare-site.py
          python tests/phrases-browser.py --site --browser /usr/bin/google-chrome --out .qa/full-stories-http
          python tests/chinese-browser.py --site --browser /usr/bin/google-chrome --out .qa/characters-http
      - name: Commit tested readable source and remove temporary transfer files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch origin work/chinese-phrases
          test "$(git rev-parse origin/work/chinese-phrases)" = "$GITHUB_SHA"
          git add -- projects/chinese/stories-data.js projects/chinese/phrases.js projects/chinese/phrases.html projects/chinese/phrases.css projects/chinese/index.html projects/chinese/README.md tests/phrases.test.cjs tests/phrases-browser.py
          git add -- index.html source.html projects/astronomy/日月地实验室.html projects/physics/index.html projects/physics/BUILD_MANIFEST.json projects/posture/index.html projects/chemistry/chemistry-explorer.html
          git rm -r -- .delivery/complete-stories .github/workflows/complete-chinese-stories.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(chinese): 补齐62篇完整故事与含义讲解，手机首屏直达正文' -m '30个成语与32条歇后语按起因、经过、结果讲完整；区分古籍、神话、小说与原创教学情境，保留出处年代。正文默认展开、顶部醒目入口；三句仅作回顾。保留造句收藏，验证全部正文与手机触摸、阅读滚动、备份及旧字卡。'
          git push origin HEAD:refs/heads/work/chinese-phrases
          git archive --format=zip HEAD > .qa/complete-stories-source.zip
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve actual navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-chinese-stories-checks
          path: .qa
          include-hidden-files: true
          retention-days: 7
