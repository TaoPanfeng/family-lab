name: Restore and verify three practical workshops

on:
  push:
    branches: ['work/three-workshops']
    paths: ['.delivery/workshops/manifest.json']

permissions:
  contents: write
concurrency:
  group: family-lab-three-workshops-restore
  cancel-in-progress: false

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore reviewed source with baseline and output checksums
        run: |
          python - <<'PY'
          import hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          folder = root / '.delivery/workshops'
          manifest = json.loads((folder / 'manifest.json').read_text())
          pieces = []
          for item in manifest['parts']:
              path = folder / item['name']
              if path.resolve().parent != folder.resolve():
                  raise RuntimeError('Invalid transfer part path')
              data = path.read_bytes()
              if len(data) != item['bytes'] or hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise RuntimeError('Transfer integrity error: ' + item['name'])
              pieces.append(data)
          archive = b''.join(pieces)
          if hashlib.sha256(archive).hexdigest() != manifest['archive_sha256']:
              raise RuntimeError('Archive integrity error')
          payload = json.loads(lzma.decompress(archive))
          if len(payload['files']) != manifest['files']:
              raise RuntimeError('Unexpected source count')
          subprocess.run(['git','merge-base','--is-ancestor',payload['base'],'HEAD'],check=True)
          for name, item in payload['files'].items():
              rel = pathlib.PurePosixPath(name)
              path = root / name
              if rel.is_absolute() or '..' in rel.parts or not rel.parts or rel.parts[0] in ('.git','.github','.delivery') or path.is_symlink() or not path.resolve().is_relative_to(root):
                  raise RuntimeError('Unsafe source path: ' + name)
              previous = item['previous_sha256']
              if previous is None:
                  if path.exists() or 'content' not in item:
                      raise RuntimeError('New path already exists: ' + name)
              elif not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != previous:
                  raise RuntimeError('Baseline changed: ' + name)
          patch = folder / 'source.patch'
          patch.write_text(payload['patch'],encoding='utf-8')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for name, item in payload['files'].items():
              path = root / name
              if item['previous_sha256'] is None:
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_text(item['content'],encoding='utf-8')
              if hashlib.sha256(path.read_bytes()).hexdigest() != item['sha256']:
                  raise RuntimeError('Restored source mismatch: ' + name)
          (folder / 'paths.json').write_text(json.dumps(list(payload['files'])))
          print('Restored and verified',len(payload['files']),'reviewed source files.')
          PY
      - name: Build all offline applications and run model regressions
        run: |
          npm run build
          node tools/test.cjs --offline
      - name: Install browser test driver and screenshot fonts
        timeout-minutes: 4
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          python -m pip install playwright==1.57.0
          google-chrome --version
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y --no-install-recommends fonts-wqy-zenhei fonts-stix
          test -n "$(fc-list :lang=zh file | head -n 1)"
      - name: Real offline interactions, audio signals and trusted mobile input
        run: python tests/workshops-browser.py --file --browser "$(command -v google-chrome)" --out .qa/workshops-file
      - name: Real HTTP interactions, audio signals and trusted mobile input
        run: |
          python tools/prepare-site.py
          python tests/workshops-browser.py --site --browser "$(command -v google-chrome)" --out .qa/workshops-http
      - name: Commit only reviewed sources and built offline pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch origin work/three-workshops
          test "$(git rev-parse origin/work/three-workshops)" = "$GITHUB_SHA"
          python - <<'PY'
          import json, subprocess
          files = json.load(open('.delivery/workshops/paths.json'))
          files += ['index.html','source.html','projects/astronomy/日月地实验室.html','projects/physics/index.html','projects/physics/BUILD_MANIFEST.json','projects/posture/index.html','projects/chemistry/chemistry-explorer.html']
          subprocess.run(['git','add','--',*files],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: 新增英语场景、编程机器人与音乐创作三馆，接入十四馆首页' -m '三馆九个动手主题：词序和图形对应、逐步执行与数据压缩、音高节拍与旋律。模型回归、真实file和HTTP、音频信号与手机触摸专项已通过，完整旧馆与上线验收由正式发布继续执行。'
          git push origin HEAD:refs/heads/work/three-workshops
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-workshops-reviewed
          path: |
            .qa/workshops-file
            .qa/workshops-http
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
