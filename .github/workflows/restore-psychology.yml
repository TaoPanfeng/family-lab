name: Restore and verify psychology
on:
  push:
    branches: ['work/psychology']
    paths: ['.delivery/psychology/manifest.json']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore checksummed reviewed source
        run: |
          python - <<'PY'
          import pathlib,json,lzma,hashlib,subprocess
          root=pathlib.Path.cwd();folder=root/'.delivery/psychology'
          manifest=json.loads((folder/'manifest.json').read_text())
          parts=[]
          for item in manifest['parts']:
              p=folder/item['name']
              if p.resolve().parent!=folder.resolve():raise RuntimeError('Unsafe part path')
              raw=p.read_bytes()
              if len(raw)!=item['bytes'] or hashlib.sha256(raw).hexdigest()!=item['sha256']:raise RuntimeError('Chunk integrity error: '+item['name'])
              parts.append(raw)
          raw=b''.join(parts)
          if hashlib.sha256(raw).hexdigest()!=manifest['archive_sha256']:raise RuntimeError('Archive checksum mismatch')
          data=json.loads(lzma.decompress(raw))
          if len(data['hashes'])!=manifest['files']:raise RuntimeError('File count mismatch')
          for name in data['hashes']:
              p=pathlib.PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts or p.parts[0] in ('.git','.github','.delivery'):raise RuntimeError('Unsafe source path')
              if not (root/p).resolve().is_relative_to(root):raise RuntimeError('Unsafe destination')
          patch=folder/'source.patch';patch.write_text(data['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for name,text in data['new'].items():
              if name not in data['hashes']:raise RuntimeError('Unexpected new path')
              p=root/name
              if p.exists():raise RuntimeError('New path already exists: '+name)
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          for name,digest in data['hashes'].items():
              if hashlib.sha256((root/name).read_bytes()).hexdigest()!=digest:raise RuntimeError('Final source mismatch: '+name)
          (folder/'restored-paths.json').write_text(json.dumps(list(data['hashes'])))
          print('Restored reviewed files:',len(data['hashes']))
          PY
      - name: Build and run content and original regression checks
        run: |
          npm --prefix projects/history ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
      - name: Install browser driver and Chinese fonts
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          python -m pip install playwright==1.57.0
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y --no-install-recommends fonts-wqy-zenhei
          test -n "$(fc-list :lang=zh file | head -n 1)"
      - name: Verify actual file and HTTP psychology interactions
        run: |
          python tests/psychology-browser.py --file --browser /usr/bin/google-chrome --out .qa/psychology-file
          python tools/prepare-site.py
          python tests/psychology-browser.py --site --browser /usr/bin/google-chrome --out .qa/psychology-http
      - name: Commit tested source without overwriting newer work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch origin work/psychology
          test "$(git rev-parse origin/work/psychology)" = "$GITHUB_SHA"
          python - <<'PY'
          import json,subprocess
          files=json.load(open('.delivery/psychology/restored-paths.json'))
          files+=['index.html','source.html','projects/astronomy/日月地实验室.html','projects/physics/index.html','projects/physics/BUILD_MANIFEST.json','projects/posture/index.html','projects/chemistry/chemistry-explorer.html']
          subprocess.run(['git','add','--',*files],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(psychology): 新增六类60个概念、双情境解释与专业来源，完善手机阅读与学习记录'
          git push origin HEAD:refs/heads/work/psychology
          git archive --format=zip HEAD > .qa/psychology-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psychology-review
          path: .qa
          include-hidden-files: true
          retention-days: 7
