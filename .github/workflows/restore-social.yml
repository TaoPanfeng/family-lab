name: Restore and verify social communication
on:
  push:
    branches: ['work/social-communication']
    paths: ['.delivery/social/manifest.json']
permissions:
  contents: write
concurrency:
  group: restore-social-communication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore reviewed source with baseline and final checksums
        run: |
          python - <<'PY'
          import hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path.cwd();folder=root/'.delivery/social'
          manifest=json.loads((folder/'manifest.json').read_text())
          subprocess.run(['git','merge-base','--is-ancestor',manifest['base_commit'],'HEAD'],check=True)
          parts=[]
          for item in manifest['parts']:
              path=folder/item['name']
              if path.resolve().parent!=folder.resolve():raise RuntimeError('Invalid chunk path')
              raw=path.read_bytes()
              if len(raw)!=item['bytes'] or hashlib.sha256(raw).hexdigest()!=item['sha256']:raise RuntimeError('Chunk mismatch: '+item['name'])
              parts.append(raw)
          packed=b''.join(parts)
          if hashlib.sha256(packed).hexdigest()!=manifest['archive_sha256']:raise RuntimeError('Archive checksum mismatch')
          files=json.loads(lzma.decompress(packed))
          if len(files)!=manifest['files']:raise RuntimeError('File count mismatch')
          # Check all old versions before applying anything; no remote branch is changed on failure.
          for name,item in files.items():
              rel=pathlib.PurePosixPath(name);path=root/name
              if rel.is_absolute() or '..' in rel.parts or not rel.parts or rel.parts[0] in ('.git','.github','.delivery'):raise RuntimeError('Unsafe path: '+name)
              if path.is_symlink() or not path.resolve().is_relative_to(root):raise RuntimeError('Unsafe destination: '+name)
              expected=item.get('expected_sha256')
              if expected:
                  if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest()!=expected:raise RuntimeError('Baseline changed: '+name)
              elif path.exists():raise RuntimeError('New path already exists: '+name)
          for name,item in files.items():
              path=root/name
              if 'patch' in item:
                  patch=item['patch'].encode('utf-8')
                  subprocess.run(['git','apply','--check','--whitespace=nowarn','-'],input=patch,check=True)
                  subprocess.run(['git','apply','--whitespace=nowarn','-'],input=patch,check=True)
              else:
                  path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(item['content'].encode('utf-8'))
              if hashlib.sha256(path.read_bytes()).hexdigest()!=item['sha256']:raise RuntimeError('Restored source mismatch: '+name)
          (folder/'restored-paths.json').write_text(json.dumps(list(files)))
          print('Restored and checked',len(files),'reviewed source files.')
          PY
      - name: Extend existing release workflow without removing original checks
        run: |
          python - <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('.github/workflows/pages.yml');raw=p.read_bytes()
          actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          if actual!='bf201f571ad19fdfd6b6a2f5af9f4b50dd61d04d':raise RuntimeError('Release workflow changed; reconcile first')
          text=raw.decode('utf-8')
          def once(old,new):
              global text
              if text.count(old)!=1:raise RuntimeError('Unexpected workflow edit context: '+old)
              text=text.replace(old,new)
          once("'music','psychology'}","'music','psychology','social'}")
          once('len(catalog) != 15','len(catalog) != 16')
          text=text.replace('fifteen','sixteen').replace('Fifteen','Sixteen')
          once('      - name: English computing and music via real file URLs','      - name: Social communication scenarios and trusted mobile gestures via file URLs\n        run: python tests/social-browser.py --file --browser "$(command -v google-chrome)" --out .qa/social-file\n      - name: English computing and music via real file URLs')
          once('      - name: English computing and music via HTTP','      - name: Social communication scenarios and trusted mobile gestures via HTTP\n        run: python tests/social-browser.py --site --browser "$(command -v google-chrome)" --out .qa/social-http\n      - name: English computing and music via HTTP')
          once('          python tests/workshops-browser.py --base "$SITE_URL"','          python tests/social-browser.py --base "$SITE_URL" --browser "$(command -v google-chrome)" --out .qa/live-social\n          python tests/workshops-browser.py --base "$SITE_URL"')
          once("for path in ['projects/psychology/data.js'","for path in ['projects/social/index.html','projects/social/data.js','projects/social/model.js','projects/social/app.js','projects/social/style.css','projects/psychology/data.js'")
          once('            .qa/live-psychology\n','            .qa/live-psychology\n            .qa/live-social\n')
          once("branch='work/psychology'","branch='work/social-communication'")
          p.write_text(text,encoding='utf-8')
          PY
      - name: Build all galleries and run every content and model regression
        run: |
          npm --prefix projects/history ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
      - name: Install browser driver and Chinese screenshot fonts
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          google-chrome --version
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y --no-install-recommends fonts-wqy-zenhei fonts-stix
          test -n "$(fc-list :lang=zh file | head -n 1)"
      - name: Verify real offline social and psychology pages
        run: |
          python tests/social-browser.py --file --browser /usr/bin/google-chrome --out .qa/social-file
          python tests/psychology-browser.py --file --browser /usr/bin/google-chrome --out .qa/psychology-file
      - name: Verify HTTP subpaths and the sixteen-gallery portal
        run: |
          python tools/prepare-site.py
          python tests/social-browser.py --site --browser /usr/bin/google-chrome --out .qa/social-http
          python tests/psychology-browser.py --site --browser /usr/bin/google-chrome --out .qa/psychology-http
          python tests/site-smoke.py --browser /usr/bin/google-chrome --out .qa/site
      - name: Commit only reviewed and tested source plus generated offline entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch origin work/social-communication
          test "$(git rev-parse origin/work/social-communication)" = "$GITHUB_SHA"
          python - <<'PY'
          import json,subprocess
          paths=json.load(open('.delivery/social/restored-paths.json'))
          paths+=['.github/workflows/pages.yml','index.html','source.html','projects/astronomy/日月地实验室.html','projects/physics/index.html','projects/physics/BUILD_MANIFEST.json','projects/posture/index.html','projects/chemistry/chemistry-explorer.html']
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(social): 新增八类48个沟通场景、默认隐藏的四选一解析和具体跟进表达' -m '心理学发布已确认后串行实现；全馆模型与新馆真实离线、HTTP、可信手机操作通过。正式发布仍需main完整回归与公开网址验收。'
          git push origin HEAD:refs/heads/work/social-communication
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve actual browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-communication-review
          path: .qa
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
