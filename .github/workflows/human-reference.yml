name: Licensed human reference
on:
  push:
    branches: ['work/learning-clarity']
    paths: ['.github/workflows/human-reference.yml']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Fetch pinned public CC0 assets and legal notice
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request, json
          commit='a8bc2d54ff0ac92e78ff71431b1023eda42bf482'
          files={'makehuman/data/3dobjs/base.obj':'d26635e9326e3cca30778fd7b9c00062b03cce09','makehuman/data/rigs/default.mhskel':'b02cbecae00143856410d7561adf006d83bf9b3e','makehuman/data/rigs/default_weights.mhw':'66185806afacf87749be8e5cf6dbf66496b2a6b0','LICENSE.md':None,'LICENSE.CC0.md':None}
          root=pathlib.Path('human-reference');root.mkdir()
          for name,expected in files.items():
              url=f'https://raw.githubusercontent.com/makehumancommunity/makehuman/{commit}/{name}'
              try:
                  with urllib.request.urlopen(url,timeout=45) as r:data=r.read()
              except Exception:
                  if name=='LICENSE.CC0.md':continue
                  raise
              blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if expected and expected!=blob:raise RuntimeError('Changed upstream asset: '+name)
              (root/pathlib.Path(name).name).write_bytes(data)
          (root/'provenance.json').write_text(json.dumps({'repository':'makehumancommunity/makehuman','commit':commit,'paths':files},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: human-reference
          path: human-reference
          retention-days: 3
