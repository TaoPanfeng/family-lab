name: Test and publish Family Lab

on:
  push:
    branches: [main]
    paths-ignore:
      - 'family-lab.zip'
      - '.github/scripts/import_archive.py'
      - '.github/workflows/import-family-lab.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-lab-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.project.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: project
        name: Check whether the initial project import is complete
        run: |
          if test -f package.json && test -f catalog.json && test -f index.html; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Initial ZIP import is incomplete. Application checks and deployment did not run.' >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    needs: inspect
    if: needs.inspect.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked test-only dependencies
        run: npm --prefix projects/history ci --ignore-scripts --no-audit --no-fund
      - name: Build all offline applications and homepage
        run: npm run build
      - name: Run model, data and DOM tests
        run: npm test
      - name: Install test driver and verify preinstalled Chrome
        timeout-minutes: 3
        run: |
          python -m pip install playwright==1.57.0
          google-chrome --version
      - name: Verify actual local-file navigation and interactions
        run: python tests/browser-smoke.py --browser "$(command -v google-chrome)" --out .qa/browser
      - name: Prepare website with corresponding source and licenses
        run: python tools/prepare-site.py
      - name: Verify HTTP subpaths, project entry links and mobile layout
        run: python tests/site-smoke.py --browser "$(command -v google-chrome)" --out .qa/site
      - name: Preserve tested offline outputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: offline-generated
          retention-days: 7
          if-no-files-found: error
          path: |
            index.html
            source.html
            projects/astronomy/日月地实验室.html
            projects/physics/index.html
            projects/posture/index.html
            projects/chemistry/chemistry-explorer.html
      - name: Upload tested static website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Preserve browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: .qa
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  sync-offline:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      current: ${{ steps.sync.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: offline-generated
          path: .
      - id: sync
        name: Commit tested offline builds without overwriting newer work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Newer source is already on main; this older run will not commit or deploy.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -- index.html source.html projects/astronomy/日月地实验室.html projects/physics/index.html projects/posture/index.html projects/chemistry/chemistry-explorer.html
          if ! git diff --cached --quiet; then
            subject="$(git show -s --format=%s "$GITHUB_SHA")"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "build: 同步已通过测试的离线成品（${GITHUB_SHA:0:7}）" -m "对应功能提交：$subject"
            git push origin HEAD:main
          fi
          echo 'current=true' >> "$GITHUB_OUTPUT"
          echo 'Offline outputs match the tested source and are committed to main.' >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: sync-offline
    if: needs.sync-offline.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Enabling a new site may require the owner's one-time Pages setting.
      # Never change repository visibility or account billing automatically.
      - name: Configure or attempt to enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy the tested website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published homepage and all five project URLs
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.parse import urljoin, quote
          from urllib.request import urlopen
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          def get(path):
              url = urljoin(base, quote(path, safe='/'))
              for attempt in range(6):
                  try:
                      with urlopen(url, timeout=30) as response:
                          if response.status != 200:
                              raise RuntimeError('Unexpected HTTP status')
                          return response.read()
                  except Exception:
                      if attempt == 5:
                          raise
                      time.sleep(5)
          home = get('index.html').decode('utf-8')
          if 'data-project="astronomy"' not in home or 'data-project="posture"' not in home:
              raise RuntimeError('Published homepage does not match Family Lab')
          catalog = json.loads(get('catalog.json'))
          if len(catalog) != 5:
              raise RuntimeError('Expected exactly five projects')
          for project in catalog:
              content = get(project['entry'])
              if b'<html' not in content[:2000].lower():
                  raise RuntimeError('Project did not return HTML: ' + project['id'])
              print('HTTP 200:', project['name'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('### Published and HTTP-verified\n\n' + base + '\n')
          PY
