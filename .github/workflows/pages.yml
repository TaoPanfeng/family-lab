name: Test and publish Family Lab

on:
  push:
    branches: [main]
    paths-ignore: ['family-lab.zip', '.github/scripts/import_archive.py', '.github/workflows/import-family-lab.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: family-lab-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked test-only dependencies
        run: npm --prefix projects/history ci --ignore-scripts --no-audit --no-fund
      - name: Build all offline applications and homepage
        run: npm run build
      - name: Test original applications and four new museums
        run: npm test
      - name: Install browser test driver and Chinese screenshot fonts
        timeout-minutes: 4
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          python -m pip install playwright==1.57.0
          google-chrome --version
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y --no-install-recommends fonts-wqy-zenhei fonts-stix
          fc-match ':lang=zh-cn'
          test -n "$(fc-list :lang=zh file | head -n 1)"
      - name: Deep physics, posture and astronomy interaction audits
        env:
          GW_BROWSER: /usr/bin/google-chrome
        run: |
          mkdir -p projects/physics/previews .qa/physics-audit
          python projects/physics/tests/browser_test.py
          cp projects/physics/docs/browser-test-report.json .qa/physics-audit/report.json
          python -c "import json; r=json.load(open('.qa/physics-audit/report.json')); assert r['loading']=='file:// direct navigation' and r['failed']==0"
          python projects/posture/tests/browser_smoke.py --browser "$(command -v google-chrome)" --out .qa/posture-audit
          python projects/astronomy/tests/v2-browser-test.py --browser "$(command -v google-chrome)" --out .qa/astronomy-audit
      - name: Original projects and eleven homepage entries via file URLs
        run: python tests/browser-smoke.py --browser "$(command -v google-chrome)" --out .qa/browser
      - name: Four museums via actual file URLs, including WebGL
        run: python tests/expansion-browser.py --file --require-webgl --browser "$(command -v google-chrome)" --out .qa/new-file
      - name: Quality regression via actual file URLs
        run: python tests/quality-browser.py --file --require-webgl --browser "$(command -v google-chrome)" --out .qa/quality-file
      - name: Math catalogue and all interactive models via file URLs
        run: python tests/math-browser.py --file --browser "$(command -v google-chrome)" --out .qa/math-file
      - name: Shared controls and human appearance via file URLs
        run: python tests/experience-browser.py --file --require-webgl --browser "$(command -v google-chrome)" --out .qa/experience-file
      - name: Trusted mobile touch gestures via file URLs
        run: python tests/mobile-touch.py --file --require-webgl --browser "$(command -v google-chrome)" --out .qa/mobile-file
      - name: Teaching examples, equations, microscope and continuous human via file URLs
        run: python tests/learning-browser.py --file --require-webgl --browser "$(command -v google-chrome)" --out .qa/learning-file
      - name: Chinese character lessons, strokes and mobile controls via file URLs
        run: python tests/chinese-browser.py --file --browser "$(command -v google-chrome)" --out .qa/chinese-file
      - name: Prepare website and corresponding source
        run: python tools/prepare-site.py
      - name: Test real homepage clicks and HTTP subpaths
        run: python tests/site-smoke.py --browser "$(command -v google-chrome)" --out .qa/site
      - name: Four museums via HTTP, including WebGL and notebook persistence
        run: python tests/expansion-browser.py --site --require-webgl --browser "$(command -v google-chrome)" --out .qa/new-http
      - name: Quality regression via HTTP, including actual rendering changes
        run: python tests/quality-browser.py --site --require-webgl --browser "$(command -v google-chrome)" --out .qa/quality-http
      - name: Math catalogue and all interactive models via HTTP
        run: python tests/math-browser.py --site --browser "$(command -v google-chrome)" --out .qa/math-http
      - name: Shared controls and human appearance via HTTP
        run: python tests/experience-browser.py --site --require-webgl --browser "$(command -v google-chrome)" --out .qa/experience-http
      - name: Trusted mobile touch gestures via HTTP
        run: python tests/mobile-touch.py --site --require-webgl --browser "$(command -v google-chrome)" --out .qa/mobile-http
      - name: Teaching examples, equations, microscope and continuous human via HTTP
        run: python tests/learning-browser.py --site --require-webgl --browser "$(command -v google-chrome)" --out .qa/learning-http
      - name: Chinese character lessons, strokes and mobile controls via HTTP
        run: python tests/chinese-browser.py --site --browser "$(command -v google-chrome)" --out .qa/chinese-http
      - name: Preserve tested offline outputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: offline-generated
          retention-days: 7
          if-no-files-found: error
          path: |
            index.html
            source.html
            projects/astronomy/日月地实验室.html
            projects/physics/index.html
            projects/physics/BUILD_MANIFEST.json
            projects/posture/index.html
            projects/chemistry/chemistry-explorer.html
      - name: Upload tested static website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Preserve browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: .qa
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  sync-offline:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      current: ${{ steps.sync.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: offline-generated
          path: .
      - id: sync
        name: Commit tested offline builds without overwriting newer work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Newer source exists; the old run will not commit or deploy.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -- index.html source.html projects/astronomy/日月地实验室.html projects/physics/index.html projects/physics/BUILD_MANIFEST.json projects/posture/index.html projects/chemistry/chemistry-explorer.html
          if ! git diff --cached --quiet; then
            subject="$(git show -s --format=%s "$GITHUB_SHA")"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "build: 同步已通过测试的离线成品（${GITHUB_SHA:0:7}）" -m "对应功能提交：$subject"
            git push origin HEAD:main
          fi
          echo 'current=true' >> "$GITHUB_OUTPUT"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: sync-offline
    if: needs.sync-offline.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy tested website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published homepage, catalogue, eleven applications and shared scripts
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.parse import urljoin, quote
          from urllib.request import urlopen
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          def get(path):
              url = urljoin(base, quote(path, safe='/')) + '?check=' + os.environ['GITHUB_SHA'][:12]
              for attempt in range(8):
                  try:
                      with urlopen(url, timeout=30) as response:
                          if response.status != 200:
                              raise RuntimeError('HTTP status: ' + str(response.status))
                          return response.read()
                  except Exception:
                      if attempt == 7:
                          raise
                      time.sleep(5)
          expected = {'astronomy','physics','chemistry','history','posture','biology','geography','cosmos','martial','math','chinese'}
          home = get('index.html').decode('utf-8')
          catalog = json.loads(get('catalog.json'))
          if {p['id'] for p in catalog} != expected or len(catalog) != 11:
              raise RuntimeError('Published catalogue does not have the expected eleven museums')
          for project in catalog:
              if ('data-project="' + project['id'] + '"') not in home:
                  raise RuntimeError('Homepage missing ' + project['id'])
              content = get(project['entry'])
              if b'<html' not in content[:2000].lower():
                  raise RuntimeError('Not HTML: ' + project['id'])
              print('HTTP 200:', project['name'])
          for path in ['shared/core.js','shared/touch.js','shared/shell.js','shared/scene3d.js','shared/lab.css','projects/biology/data.js','projects/geography/app.js','projects/cosmos/data.js','projects/martial/model.js','projects/martial/hands.js','shared/canvas3d.js','projects/biology/process-models.js','projects/biology/visuals.js','projects/geography/countries.js','projects/geography/terrain.js','projects/geography/map-engine.js','projects/cosmos/process-models.js','projects/cosmos/visuals.js','projects/physics/optics.html','projects/physics/optics/model.js','projects/physics/optics/data.js','projects/physics/optics/app.js','projects/math/index.html','projects/math/data.js','projects/math/model.js','projects/math/labs.js','projects/math/proofs.js','projects/math/app.js','projects/math/style.css','shared/formula.js','shared/formula.css','shared/vendor/katex/katex.min.js','projects/math/teaching-data.js','projects/math/teaching.js','projects/math/lesson-visuals.js','projects/chemistry/experiments/index.html','projects/chemistry/experiments/model.js','projects/biology/microscope/index.html','projects/biology/microscope/model.js','projects/biology/respiration.js','projects/martial/human.js','projects/martial/assets/human.js','projects/chinese/index.html','projects/chinese/data.js','projects/chinese/model.js','projects/chinese/app.js','projects/chinese/style.css','projects/chinese/stroke-data.js','projects/chinese/vendor/hanzi-writer.min.js']:
              if len(get(path)) < 100:
                  raise RuntimeError('Missing runtime asset: ' + path)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('### Eleven museums published and HTTP-verified\n\n' + base + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual published quality, mathematics and common controls
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          python -m pip install playwright==1.57.0
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y --no-install-recommends fonts-wqy-zenhei fonts-stix
          test -n "$(fc-list :lang=zh file | head -n 1)"
          python tests/quality-browser.py --base "$SITE_URL" --require-webgl --browser "$(command -v google-chrome)" --out .qa/live-quality
          python tests/math-browser.py --base "$SITE_URL" --browser "$(command -v google-chrome)" --out .qa/live-math
          python tests/experience-browser.py --base "$SITE_URL" --require-webgl --browser "$(command -v google-chrome)" --out .qa/live-experience
          python tests/mobile-touch.py --base "$SITE_URL" --require-webgl --browser "$(command -v google-chrome)" --out .qa/live-mobile
          python tests/learning-browser.py --base "$SITE_URL" --require-webgl --browser "$(command -v google-chrome)" --out .qa/live-learning
          python tests/chinese-browser.py --base "$SITE_URL" --browser "$(command -v google-chrome)" --out .qa/live-chinese
      - name: Preserve online interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-quality-results
          path: |
            .qa/live-quality
            .qa/live-math
            .qa/live-experience
            .qa/live-mobile
            .qa/live-learning
            .qa/live-chinese
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  cleanup-merged-work-branch:
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Remove only the fully merged, closed work branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch='work/chinese-literacy'
          gh auth setup-git
          head="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
          if test -z "$head"; then
            echo 'Work branch already removed; main is retained.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          open_prs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f "head=${GITHUB_REPOSITORY_OWNER}:$branch" --jq 'length')"
          test "$open_prs" = '0'
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" "refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse "origin/$branch")" = "$head"
          git merge-base --is-ancestor "$head" origin/main
          test "$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)" = "$head"
          git push origin --delete "$branch"
          echo 'Merged work branch removed after successful live validation; history remains in main.' >> "$GITHUB_STEP_SUMMARY"
