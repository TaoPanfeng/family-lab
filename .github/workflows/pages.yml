name: Test and publish Family Lab

on:
  push:
    branches: [main]
    paths-ignore:
      - 'family-lab.zip'
      - '.github/scripts/import_archive.py'
      - '.github/workflows/import-family-lab.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.project.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: project
        name: Check whether the initial project import is complete
        run: |
          if test -f package.json && test -f catalog.json && test -f index.html; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Project ZIP has not been imported. No application tests or deployment ran.' >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    needs: inspect
    if: needs.inspect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked test-only dependency
        run: npm --prefix projects/history ci --ignore-scripts --no-audit --no-fund
      - name: Build offline applications and homepage
        run: npm run build
      - name: Require committed offline builds to match source
        run: git diff --exit-code -- index.html source.html projects/astronomy/日月地实验室.html projects/physics/index.html projects/posture/index.html projects/chemistry/chemistry-explorer.html
      - name: Run model, data and DOM tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check local-file navigation and interactions
        run: python tests/browser-smoke.py --out .qa/browser
      - name: Prepare static website and corresponding source
        run: python tools/prepare-site.py
      - id: pages
        name: Check Pages without changing visibility or repository settings
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/pages'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'Family-Lab-CI'})
          enabled = False
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  site = json.load(response)
              enabled = site.get('build_type') == 'workflow'
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('enabled=' + str(enabled).lower() + '\n')
          if not enabled:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('Code verification passed. Website NOT published: Pages is unavailable or not configured with GitHub Actions as its source. No visibility or account-plan changes were made.\n')
          PY
      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: verify
    if: needs.verify.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
