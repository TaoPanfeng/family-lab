name: Review researched phrase corrections
on:
  push:
    branches: ['work/chinese-phrases']
    paths: ['.github/workflows/review-phrases-corrections.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed source corrections without replacing unrelated work
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('projects/chinese/phrases-data.js')
          raw=p.read_bytes()
          actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          if actual!='de27589c3fa9fa4e99cdc91d2b2485b1926498eb':
              raise RuntimeError('Source changed; review before applying corrections')
          text=raw.decode('utf-8')
          prefix,body=text.split('function(){return ',1)
          data=json.loads(body.rsplit(';});',1)[0])
          entries={e['id']:e for group in data.values() for e in group}
          assert len(data['idioms'])==30 and len(data['sayings'])==32
          entries['x05']['meaning']='外甥提灯照着舅舅，是“照舅”。舅（jiu4）与旧（jiu4）同音，所以借说事情仍按原样进行。'
          entries['x05']['source'].update(work='《重编国语辞典修订本》收录“外甥打灯笼”；该词条解释照舅／照旧的谐音',url='https://dict.revised.moe.edu.tw/dictView.jsp?ID=160572&la=0&powerMode=0',type='词典收录，首见未考')
          entries['x16']['meaning']='门缝限制了能看到的范围，并不会真的把人变扁。“看扁”在这里还表示轻视别人，是语言上的双关。'
          entries['x16']['source'].update(work='《重编国语辞典修订本》“门缝里看人”词条；与“隔着门缝看人”是相近说法',url='https://dict.revised.moe.edu.tw/dictView.jsp?ID=30112&la=0&powerMode=0',type='词典收录，首见未考')
          entries['x17']['meaning']='“丈二”形容非常高，想象旁人够不到这个高个子的头。借“摸不着头脑”说一时弄不明白，不是在讲真实的人体比例。'
          entries['x30']['meaning']='把老虎当拉车的牲口，谁敢赶它呢？赶（gan3）与敢（gan3）同音，借说没有人敢做；这不是让人真的接近老虎。'
          entries['x14']['meaning']='民间说法把没有头发的“发”（fa4）借成“法”（fa3），又把伞遮天作比喻。普通话声调不同，是借近音开玩笑，不是对僧人的事实判断。'
          entries['x12']['example']='我受了委屈却一时说不清，像有苦说不出。这是旧时说法，不要用它嘲笑语言障碍者；可以找可信的大人帮忙。'
          entries['x09']['example']='我劝两个朋友停止争吵，两边却都埋怨我，真是两头受气。我可以请老师帮助大家沟通。'
          entries['i16']['example']='还没学会乘法，就逼自己立刻做复杂的除法题，急得连基础也弄乱了；这样急于求成，可能是揠苗助长。'
          entries['i10']['example']='我决定认真准备演出，请家长暂时收好游戏机，让自己专心练习。这是下定决心的比喻，不是真的砸坏东西。'
          entries['i18']['example']='我想请学长指导模型制作，提前准备问题，又多次诚恳拜访；可以借三顾茅庐表达求教的诚意。'
          entries['i12']['source']['url']='https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=20&webMd=2'
          entries['i18']['source']['url']='https://ctext.org/text.pl?if=gb&node=603498&remap=gb'
          entries['i20']['source'].update(url='https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=382&webMd=2',note='本页讲张僧繇传说，见唐代《历代名画记》卷七；词典另列晋代《拾遗记》的相关点睛传说。不同传说、成书时期与四字用语的定型时间不能混为一谈。')
          entries['i30']['source'].update(work='《朱子语类》卷四十一有“对证下药”；《成语典》将它列为可能的语源线索',era='宋代语录线索（12—13世纪）；现代写法“对症下药”的确切首见年代未核实',url='https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=277&webMd=2',type='可能语源，不断言唯一首见',note='词典写“语或本”，这里保留不确定性；古代医理、相关故事与固定成语的出现日期不是一回事。')
          entries['x01']['source'].update(work='《重编国语辞典修订本》“竹篮儿打水”词条引《金瓶梅》第九十一回',era='可查的相关用语见明代小说；本页固定前后句的确切成形年代未详',url='https://dict.revised.moe.edu.tw/dictView.jsp?ID=118180&la=0&powerMode=0',type='相关用语的文献线索',note='引文证明相关用语有文献记录，不能证明这是“一场空”整句的最早出处。查证入口为词典，不导入小说其他内容。')
          entries['x31']['source'].update(work='《重编国语辞典修订本》“打破砂锅问到底”引《英烈传》第三十一回，另列“打破沙锅璺到底”',era='可查的相关表达见明代《英烈传》；最早成形年份未详',url='https://dict.revised.moe.edu.tw/dictView.jsp?ID=39731&la=0&powerMode=0',type='词典列出的书证',note='这里给出已查到的使用记录，不断言最早首创者；“璺”指裂纹，读wen4，与“问”同音。')
          entries['x32']['source'].update(work='《重编国语辞典修订本》引《初刻拍案惊奇》卷三“十五个吊桶打水，七上八落”，并列“七上八下”变体',era='明代文献线索（17世纪）；本页固定说法的确切首见年份待考',url='https://dict.revised.moe.edu.tw/dictView.jsp?ID=127537&la=0&powerMode=0',type='书证与流传变体',note='已查到“七上八落”的文献例子，不直接把它当作“七上八下”的最早年份。版本、前后句变体和成书时期分开看。')
          p.write_text(prefix+'function(){return '+json.dumps(data,ensure_ascii=False,indent=2)+';});\n',encoding='utf-8')
          doc=pathlib.Path('projects/chinese/README.md')
          doc.write_text(doc.read_text()+'\n## 后续复核修正\n\n纠正“外甥打灯笼”的舅／旧谐音；说明门缝并不真的压扁人、发／法在普通话中声调不同。补充《成语典》《重编国语辞典修订本》的具体词条及书证，并区分相关用语、流传变体和未经证明的最早定型日期。孩子的未保存造句切换后暂留本页，导出包含草稿；保存受阻时明确提示。新专项检查覆盖手机真实触摸、备份合并和错误导入，不能把窄屏鼠标检查当作触屏验收。\n',encoding='utf-8')
          PY
      - name: Content structure and browser script syntax
        run: |
          node --check projects/chinese/phrases.js
          node --test tests/*phrases*.cjs
          python -m py_compile tests/phrases-browser.py
      - name: Install real browser driver
        run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Real file and HTTP interaction including trusted mobile gestures
        run: |
          python tests/phrases-browser.py --file --browser /usr/bin/google-chrome --out .qa/phrases-correction-file
          python tests/phrases-browser.py --browser /usr/bin/google-chrome --out .qa/phrases-correction-http
      - name: Commit tested corrections without overwriting newer branch changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch origin work/chinese-phrases
          test "$(git rev-parse origin/work/chinese-phrases)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/chinese/phrases-data.js projects/chinese/README.md
          git commit -m 'fix(chinese): 校正谐音、改善儿童例句并补充可核查的典籍书证'
          git push origin HEAD:refs/heads/work/chinese-phrases
          git archive --format=zip HEAD > .qa/phrases-correction-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phrases-correction-review
          path: .qa
          include-hidden-files: true
          retention-days: 7
