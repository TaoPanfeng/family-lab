name: Verify reviewed mobile gestures
on:
  push:
    branches: ['work/mobile-touch']
    paths: ['.delivery/mobile/manifest.json', '.github/workflows/mobile-review.yml']
permissions:
  contents: write
concurrency:
  group: family-lab-mobile-review
  cancel-in-progress: false
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact checksummed reviewed patch
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib,json,lzma,subprocess
          folder=Path('.delivery/mobile')
          manifest=json.loads((folder/'manifest.json').read_text())
          data=b''.join((folder/f'part-{i}.bin').read_bytes() for i in range(3))
          if hashlib.sha256(data).hexdigest()!=manifest['archive_sha256']:
              raise RuntimeError('Transfer checksum mismatch')
          patch=lzma.decompress(data)
          if hashlib.sha256(patch).hexdigest()!=manifest['patch_sha256']:
              raise RuntimeError('Patch checksum mismatch')
          target=folder/'reviewed.patch';target.write_bytes(patch)
          for name in manifest['files']:
              path=PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts or path.parts[0] in ('.git','.github','.delivery'):
                  raise RuntimeError('Invalid reviewed path')
          subprocess.run(['git','apply','--check','--unidiff-zero','--index',str(target)],check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index',str(target)],check=True)
          actual=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip('\0').split('\0')
          if set(actual)!=set(manifest['files']):raise RuntimeError('Unexpected modified path')
          for name,expected in manifest['files'].items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest()!=expected:
                  raise RuntimeError('Source mismatch: '+name)
          print('Verified',len(actual),'reviewed source changes.')
          PY
      - name: Build and validate all models and DOM suites
        run: |
          npm --prefix projects/history ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
      - name: Install touch test driver and screenshot fonts
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          python -m pip install playwright==1.57.0
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y --no-install-recommends fonts-wqy-zenhei
      - name: Real file URLs and trusted touch gestures with WebGL
        run: python tests/mobile-touch.py --file --require-webgl --browser "$(command -v google-chrome)" --out .qa/mobile-file
      - name: Real HTTP gestures and existing shared-control regression
        run: |
          python tools/prepare-site.py
          python tests/mobile-touch.py --site --require-webgl --browser "$(command -v google-chrome)" --out .qa/mobile-http
          python tests/experience-browser.py --site --require-webgl --browser "$(command -v google-chrome)" --out .qa/experience-mobile-review
      - name: Commit only reviewed source and regenerated offline applications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch origin work/mobile-touch
          test "$(git rev-parse origin/work/mobile-touch)" = "$GITHUB_SHA"
          git add -- index.html source.html projects/astronomy/日月地实验室.html projects/physics/index.html projects/physics/BUILD_MANIFEST.json projects/posture/index.html projects/chemistry/chemistry-explorer.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(mobile): 隔离模型与滚页手势，支持双指缩放并放大触控区域' -m '修复地图和人物多指交接、取消误选与滑块抢滚动；保留文字区滚动及浏览器缩放，增加操作模型/滑动页面开关，优化数学选课定位。可信触摸输入的真实file和HTTP、WebGL及原有控件回归通过；合并后执行完整发布与线上验收。'
          git push origin HEAD:refs/heads/work/mobile-touch
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve mobile review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-review-evidence
          path: .qa
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
