name: Restore and verify Chinese museum
on:
  push:
    branches: ['work/chinese-literacy']
    paths: ['.delivery/chinese/manifest.json']
permissions:
  contents: write
concurrency:
  group: family-lab-chinese-reviewed-transfer
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact reviewed source and checked baseline edits
        run: |
          python - <<'PY'
          import hashlib, json, lzma, pathlib
          root=pathlib.Path.cwd()
          folder=root/'.delivery/chinese'
          manifest=json.loads((folder/'manifest.json').read_text())
          parts=[]
          for item in manifest['parts']:
              path=folder/item['name']
              if path.resolve().parent!=folder.resolve():raise RuntimeError('Unsafe part path')
              raw=path.read_bytes()
              if len(raw)!=item['bytes'] or hashlib.sha256(raw).hexdigest()!=item['sha256']:raise RuntimeError('Chunk integrity: '+item['name'])
              parts.append(raw)
          compressed=b''.join(parts)
          if hashlib.sha256(compressed).hexdigest()!=manifest['sha256']:raise RuntimeError('Archive checksum')
          files=json.loads(lzma.decompress(compressed))
          if len(files)!=manifest['files']:raise RuntimeError('File count')
          ready=[]
          for name,item in files.items():
              rel=pathlib.PurePosixPath(name)
              if rel.is_absolute() or '..' in rel.parts or not rel.parts or rel.parts[0] in ('.git','.github','.delivery'):raise RuntimeError('Unsafe file: '+name)
              path=root/name
              if path.is_symlink() or not path.resolve().is_relative_to(root):raise RuntimeError('Unsafe destination: '+name)
              if 'edits' in item:
                  original=path.read_bytes()
                  if hashlib.sha256(original).hexdigest()!=item['base_sha256']:raise RuntimeError('Baseline changed: '+name)
                  lines=original.decode('utf-8').splitlines(keepends=True)
                  for edit in reversed(item['edits']):lines[edit['start']:edit['end']]=edit['lines']
                  data=''.join(lines).encode('utf-8')
              else:data=item['content'].encode('utf-8')
              if hashlib.sha256(data).hexdigest()!=item['sha256']:raise RuntimeError('Reviewed source integrity: '+name)
              ready.append((path,data))
          for path,data in ready:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          (folder/'restored-paths.json').write_text(json.dumps(list(files)))
          print('Restored',len(files),'reviewed source files; all hashes verified.')
          PY
      - name: Build offline applications and run all available model suites
        run: |
          npm run build
          node tools/test.cjs --offline
      - name: Install browser driver and screenshot fonts
        timeout-minutes: 4
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          python -m pip install playwright==1.57.0
          google-chrome --version
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y --no-install-recommends fonts-wqy-zenhei fonts-stix
      - name: Chinese museum via actual file URLs and trusted touch
        run: python tests/chinese-browser.py --file --browser "$(command -v google-chrome)" --out .qa/chinese-file
      - name: Chinese museum and eleven homepage entries via HTTP
        run: |
          python tools/prepare-site.py
          python tests/chinese-browser.py --site --browser "$(command -v google-chrome)" --out .qa/chinese-http
          python tests/site-smoke.py --browser "$(command -v google-chrome)" --out .qa/site
      - name: Commit verified source and rebuilt offline outputs without replacing newer work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch origin work/chinese-literacy
          test "$(git rev-parse origin/work/chinese-literacy)" = "$GITHUB_SHA"
          python - <<'PY'
          import json,subprocess
          files=json.load(open('.delivery/chinese/restored-paths.json'))
          files+=['index.html','source.html','projects/astronomy/日月地实验室.html','projects/physics/index.html','projects/physics/BUILD_MANIFEST.json','projects/posture/index.html','projects/chemistry/chemistry-explorer.html']
          subprocess.run(['git','add','--',*files],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(chinese): 新增拼音索引语文馆，串联拆字、笔顺、组词、名句与造句' -m '102字、112个常用读音条目；区分现代字形、记忆联想与有据字源，配离线笔顺和辨字练习。已通过模型、真实file及HTTP专项和十一馆入口检查；合并后继续完整回归和公开网站验收。'
          git push origin HEAD:work/chinese-literacy
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve actual Chinese browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinese-review-evidence
          path: .qa
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
