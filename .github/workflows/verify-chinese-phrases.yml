name: Check Chinese idioms, sayings and 20 character additions
on:
  push:
    branches: ['work/chinese-phrases']
    paths:
      - '.github/workflows/verify-chinese-phrases.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalogue, sources and old character lessons
        run: |
          node --test tests/chinese-models.test.cjs tests/phrases.test.cjs
          npm run build
      - name: Install browser driver
        run: python -m pip install playwright==1.57.0
      - name: Exercise actual offline file URLs
        run: |
          python tests/phrases-browser.py --file --browser "$(command -v google-chrome)" --out .qa/phrases-file
          python tests/chinese-browser.py --file --browser "$(command -v google-chrome)" --out .qa/chinese-file
      - name: Exercise actual HTTP URLs
        run: |
          python tools/prepare-site.py
          python tests/phrases-browser.py --site --browser "$(command -v google-chrome)" --out .qa/phrases-http
          python tests/chinese-browser.py --site --browser "$(command -v google-chrome)" --out .qa/chinese-http
      - name: Preserve screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinese-phrases-checks
          path: .qa
          retention-days: 7
          if-no-files-found: ignore
